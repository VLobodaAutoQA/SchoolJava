plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.0'

    testImplementation 'io.cucumber:cucumber-java:7.20.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.20.1'

    implementation 'io.rest-assured:rest-assured:5.3.0'

    implementation("net.datafaker:datafaker:2.5.4")
    implementation("com.github.lalyos:jfiglet:0.0.9")

    testImplementation 'com.codeborne:selenide:7.0.4'

    testImplementation 'io.qameta.allure:allure-junit5:2.25.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.25.1'
}

tasks.withType(JavaExec) {
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8']
}

test {
    useJUnitPlatform()
    systemProperty("cucumber.junit-platform.naming-strategy", "long")

    def aspectj = configurations.testRuntimeClasspath.find { it.name.contains('aspectjweaver') }
    if (aspectj != null) {
        jvmArgs "-javaagent:${aspectj}"
    }

    systemProperty 'allure.results.directory',
            layout.buildDirectory.dir("allure-results").get().asFile.absolutePath

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // Оставляем ТОЛЬКО тесты из пакета, где лежат Calculator-тесты
    filter {
        includeTestsMatching "ru.alfabank.edu.lesson20.*"
    }
}

allure {
    adapter {
        // Настройки для сбора результатов тестов
    }
    report {
        // Настройки для генерации HTML-отчёта
    }
}